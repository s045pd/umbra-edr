version: "3.2"
services:
  redis:
    image: redis:alpine
    command: redis-server --appendonly no
    restart: always

  db:
    image: postgres:15
    restart: always
    # Defensive lock budget so future Sequelize-style multi-ALTER batches
    # don't blow up like the original Node version did. Harmless to keep.
    command: postgres -c max_locks_per_transaction=256
    volumes:
      - umbra-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD env var is required}
      POSTGRES_USER: umbra
      POSTGRES_DB: umbra
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "umbra"]
      interval: 5s
      timeout: 5s
      retries: 10

  umbra-server:
    build: .
    image: umbra-server:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: umbra
      DATABASE_USER: umbra
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD env var is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BCRYPT_ROUNDS: 10
      API_PORT: 8118
      WS_PORT: 4343
      PROXY_PORT: 8080
      GUI_DIST_PATH: /work/gui/dist
      CA_DIR: /work/cassl
    volumes:
      - ../gui-next/dist:/work/gui/dist:ro
      - umbra-cassl:/work/cassl
    ports:
      - "8119:8080"   # HTTP proxy
      - "4343:4343"   # WebSocket (bots)
      - "8118:8118"   # Web panel + REST API

volumes:
  umbra-db:
  umbra-cassl:
